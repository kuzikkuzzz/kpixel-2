server {
  listen 80;
  listen [::]:80;

  server_name storage.pixelplanet.fun;

  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  ssl_certificate /etc/letsencrypt/live/storage.pixelplanet.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/storage.pixelplanet.fun/privkey.pem;
  ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /srv/canvas;
  index index.html index.html;

  location / {
    autoindex on;
    expires 2h;
    add_header Cache-Control "public";
  }

  location /favicon.ico {
    expires max;
    add_header Cache-Control "public";
  }

  location ~ "^/404.\.png$" {
    types {} default_type "text/plain";
    # two weeks cached
    add_header Cache-Control "public, max-age=1209600" always;
    add_header Access-Control-Allow-Origin * always;
    return 404 "tile is empty";
  }

  # YYYY/MM/DD/CANVASID/HHMM/X/Y.png
  location ~ "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/[0-9]+/[0-9]{4}/[0-9]+/[0-9]+\.png$" {
    error_page 404 /404e.png;
    expires max;
    add_header Cache-Control "public";
    add_header Access-Control-Allow-Origin *;
  }

  # YYYY/MM/DD/CANVASID/tiles/X/Y.png
  location ~ "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/[0-9]+/tiles/[0-9]+/[0-9]+\.png$" {
    error_page 404 /404p.png;
    expires max;
    add_header Cache-Control "public";
    add_header Access-Control-Allow-Origin *;
  }
}
